name: Backtest data
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/backtest-fetch.mjs
      - run: |
          git config user.name "backtest-bot"; git config user.email "backtest-bot@users.noreply.github.com"
          git add data/backtest
          git diff --cached --quiet && exit 0
          git commit -m "Data: scorer backtest lines"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
