name: Lineups
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/20 11-21 * * *"   # every 20 minutes, 12:00-22:59 Warsaw (winter): ESPN posts starters about an hour before kick-off
permissions:
  contents: write
concurrency: { group: lineups, cancel-in-progress: false }
jobs:
  lineups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Confirmed lineups from ESPN
        run: node scripts/lineups-espn.mjs
      - name: Rebuild automatic player lists for the confirmed starters
        run: node scripts/players.mjs attach && node scripts/football-data.mjs attach || echo "::warning::attach failed"
      - name: Check
        run: npm test && node scripts/check.mjs $(TZ=Europe/Warsaw date +%F) || echo "::warning::check flagged something"
      - name: Commit
        run: |
          git config user.name "lineups-bot"; git config user.email "lineups-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && exit 0
          git commit -m "Data: lineups $(date -u +%FT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
