name: Grade
on:
  workflow_dispatch:
    inputs:
      dates: { description: "Warsaw dates to grade, space-separated (empty = last 7 days' open games)", default: "" }
      dry: { description: "Dry run: print the legs, commit nothing", type: boolean, default: false }
  schedule:
    - cron: "10 7 * * *"    # 08:10 Warsaw (winter): after the late games, before the 08:40 odds run and the 09:47 morning build
permissions:
  contents: write
concurrency: { group: grade, cancel-in-progress: false }
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # games are priced from the commit before kick-off
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Team and referee stats from football-data.co.uk
        run: node scripts/football-data.mjs fetch && node scripts/football-data.mjs attach || echo "::warning::football-data step failed"
      - name: Grade from ESPN
        run: node scripts/grade-espn.mjs ${{ github.event.inputs.dates }} ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
      - name: Check
        run: npm test
      - name: Commit
        if: ${{ github.event.inputs.dry != 'true' }}
        run: |
          git config user.name "grade-bot"; git config user.email "grade-bot@users.noreply.github.com"
          git add public/data data/football-data
          git diff --cached --quiet && exit 0
          git commit -m "Data: grading and stats $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
